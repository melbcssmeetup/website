name: Discord Notifications

on:
    workflow_run:
        workflows: ["pages-build-deployment"]
        types:
            - completed
    issues:
        types: [opened]

jobs:
    discord-updates:
        runs-on: ubuntu-latest
        steps:
            - name: Issue Opened
              if: github.event_name == 'issues'
              run: |
                  curl -H "Content-Type: application/json" \
                       -d "{\"content\": \"**New Issue:** ${{ github.event.issue.title }}\n${{ github.event.issue.html_url }}\"}" \
                       ${{ secrets.DISCORD_WEBHOOK }}
            - name: Build Success
              if: >
                  github.event_name == 'workflow_run' && 
                  github.event.workflow_run.conclusion == 'success'
              run: |
                  # Get details from the deployment event
                  COMMIT_MSG="${{ github.event.workflow_run.head_commit.message }}"
                  AUTHOR="${{ github.event.workflow_run.head_commit.author.name }}"
                  SITE_URL="https://melbcss.com/"
                  curl -H "Content-Type: application/json" \
                       -d "{\"content\": \"**A New Site Update Has Just Gone Live!**\n**Changes:** $COMMIT_MSG\n**By:** $AUTHOR\n[View Site]($SITE_URL)\"}" \
                       ${{ secrets.DISCORD_WEBHOOK }}
